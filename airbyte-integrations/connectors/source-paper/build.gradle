plugins {
    id 'airbyte-python'
    id 'airbyte-docker'
    id 'airbyte-connector-acceptance-test'
}

airbytePython {
    moduleDirectory 'source_paper'
}

tasks.named('integrationTest') {
    setDependsOn([])
    actions.clear()
    doLast {
        exec {
            workingDir projectDir
            commandLine 'uv', 'run', '--python', '3.11', '--with-editable', '.', '--with', 'pytest', 'pytest', 'unit_tests'
        }
    }
}
